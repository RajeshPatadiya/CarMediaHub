name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Auto APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMediaHub-Android-Auto-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build Apple CarPlay IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install --repo-update

      - name: Build and Archive iOS App
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild archive \
            -workspace CarMediaHub.xcworkspace \
            -scheme CarMediaHub \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/CarMediaHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA (Unsigned Payload)
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -r build/CarMediaHub.xcarchive/Products/Applications/CarMediaHub.app build/Payload/
          cd build && zip -qr CarMediaHub-CarPlay-debug.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarMediaHub-CarPlay-debug.ipa
          path: ios/build/CarMediaHub-CarPlay-debug.ipa
